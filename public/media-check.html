<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生日页图片检测</title>
<style>
body{margin:0;padding:24px;background:#171125;color:#f6e9ef;font:16px/1.7 system-ui,sans-serif}main{max-width:620px;margin:auto}h1{font-size:24px}button,a{color:inherit}button{padding:10px 18px;border:1px solid #cda3bd;background:#563a58;border-radius:10px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;padding:16px;background:#241b30;border-radius:12px}img{display:block;max-width:100%;max-height:240px;margin:16px 0}textarea{box-sizing:border-box;width:100%;height:260px;background:#241b30;color:inherit;border:1px solid #9a7e9d;padding:12px;font:12px/1.5 monospace}
</style>
<main>
<h1>生日页图片检测</h1>
<p>这页单独运行蛋糕并记录启动步骤。请保持页面打开，显示「检测完成」后复制结果。</p>
<iframe id="cake" title="蛋糕启动检测" sandbox="allow-scripts" style="display:block;width:100%;height:450px;border:1px solid #80618b;border-radius:14px"></iframe>
<div id="samples"></div>
<pre id="progress">正在检测…</pre>
<button id="copy" type="button">复制检测结果</button>
<textarea id="report" readonly aria-label="检测结果"></textarea>
<p><a href="./?phase=main&v=20261122-5">返回生日页</a></p>
</main>
<script>
const lines = ["检测版本 5", location.href, navigator.userAgent];
function log(text) {
  lines.push(text);
  document.getElementById("progress").textContent = lines.join("\n");
  document.getElementById("report").value = lines.join("\n");
}
async function check(path, image) {
  const url = new URL(path, location.href);
  url.searchParams.set("check", Date.now());
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 18000);
  const start = performance.now();
  try {
    const response = await fetch(url, { cache: "no-store", signal: controller.signal });
    const body = await response.blob();
    log(path + " → HTTP " + response.status + "，" + body.size + " 字节，" + body.type + "，" + Math.round(performance.now() - start) + "ms");
    if (image && response.ok) {
      const img = document.createElement("img");
      img.alt = "测试照片";
      document.getElementById("samples").append(img);
      const blobURL = URL.createObjectURL(body);
      try {
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error("图片解码超时")), 6000);
          img.onload = () => { clearTimeout(timeout); resolve(); };
          img.onerror = () => { clearTimeout(timeout); reject(new Error("图片解码失败")); };
          img.src = blobURL;
        });
        log(path + " → 解码成功 " + img.naturalWidth + "×" + img.naturalHeight);
      } finally { URL.revokeObjectURL(blobURL); }
    }
  } catch (error) { log(path + " → " + error.name + " " + error.message); }
  finally { clearTimeout(timer); }
}
const frame = document.getElementById("cake");
const startCake = performance.now();
let cakeFinished = false;
const cakeCheck = new Promise(resolve => {
  const timeout = setTimeout(() => {
    if (!cakeFinished) log("蛋糕运行 30 秒仍未报告完成，请保留上方最后一个步骤");
    resolve();
  }, 30000);
  window.addEventListener("message", event => {
    if (event.source !== frame.contentWindow || event.data?.type !== "birthday-cake-status") return;
    const stage = String(event.data.stage);
    log("蛋糕 " + Math.round(performance.now() - startCake) + "ms → " + stage);
    if (/首次绘制完成|启动失败/.test(stage)) {
      cakeFinished = true;
      clearTimeout(timeout);
      resolve();
    }
  });
  frame.onload = () => log("蛋糕 iframe 文档已载入");
  frame.src = "cake/birthday-cake-demo.html?rev=5";
});
Promise.all([
  check("memories/thumb/23.jpg", true),
  check("memories/thumb/23.webp", true),
  cakeCheck,
]).then(() => log("检测完成"));
document.getElementById("copy").onclick = async () => {
  const report = document.getElementById("report");
  try {
    await navigator.clipboard.writeText(report.value);
    document.getElementById("copy").textContent = "已复制";
  } catch (_) {
    report.focus();
    report.select();
    document.execCommand("copy");
    document.getElementById("copy").textContent = "已选中，可长按复制";
  }
};
</script>
</html>
